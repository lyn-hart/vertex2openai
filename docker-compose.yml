version: '3.8'

services:
  openai-to-gemini:
    image: ghcr.io/lyn-hart/vertex2openai:latest
    container_name: vertex2openai
    ports:
      - "8050:8050"
    environment:
      # API key for authentication (default: 123456)
      - API_KEY=123456
      # Enable/disable fake streaming (default: false)
      - FAKE_STREAMING=false
      # Interval for fake streaming keep-alive messages (default: 1.0)
      - FAKE_STREAMING_INTERVAL=1.0
      # Retry count for upstream 429 responses (default: 3, set 0 to disable)
      - RETRY_COUNT=3
      # Fixed interval between upstream 429 retries in milliseconds (default: 1000)
      - RETRY_INTERVAL_MS=1000
      # Remote model list URL
      - MODELS_CONFIG_URL=https://raw.githubusercontent.com/ldsx163/vertex2openai/refs/heads/main/vertexModels.json
    restart: unless-stopped
